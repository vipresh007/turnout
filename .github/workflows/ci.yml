name: CI

on:
  pull_request:
  workflow_call: # the deploy workflow runs these checks before shipping

permissions:
  contents: read

jobs:
  checks:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint -w @turnout/mobile
      - name: Web build
        run: npx expo export -p web
        working-directory: apps/mobile
